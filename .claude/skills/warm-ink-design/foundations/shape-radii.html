<!-- @dsCard group="Shape" viewport="700x140" name="Radii" subtitle="4px is the default control corner; pills are reserved for live status chips" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-canvas); color:var(--text-primary);
         -webkit-font-smoothing:antialiased; padding:20px 24px; }
  .lbl { font-family:var(--font-mono); font-size:10px; letter-spacing:var(--tracking-micro);
         text-transform:uppercase; color:var(--text-tertiary); }
  .row { display:flex; gap:var(--space-3); align-items:flex-start; }
</style>
</head>
<body>
<div class="row" style="gap:var(--space-4)">
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;flex:1">
      <div style="width:100%;height:48px;border-radius:var(--radius-xs);background:var(--surface-card);border:1px solid var(--border-strong)"></div>
      <div class="lbl">2</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;flex:1">
      <div style="width:100%;height:48px;border-radius:var(--radius-sm);background:var(--surface-card);border:1px solid var(--border-strong)"></div>
      <div class="lbl">3</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;flex:1">
      <div style="width:100%;height:48px;border-radius:var(--radius-md);background:var(--surface-card);border:1px solid var(--border-strong)"></div>
      <div class="lbl">4</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;flex:1">
      <div style="width:100%;height:48px;border-radius:var(--radius-lg);background:var(--surface-card);border:1px solid var(--border-strong)"></div>
      <div class="lbl">6</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;flex:1">
      <div style="width:100%;height:48px;border-radius:var(--radius-xl);background:var(--surface-card);border:1px solid var(--border-strong)"></div>
      <div class="lbl">8</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;flex:1">
      <div style="width:100%;height:48px;border-radius:var(--radius-2xl);background:var(--surface-card);border:1px solid var(--border-strong)"></div>
      <div class="lbl">12</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center;flex:1">
      <div style="width:100%;height:48px;border-radius:var(--radius-full);background:var(--surface-card);border:1px solid var(--border-strong)"></div>
      <div class="lbl">pill</div>
    </div>
  </div>
</body>
</html>
