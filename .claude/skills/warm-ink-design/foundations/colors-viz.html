<!-- @dsCard group="Colors" viewport="700x130" name="Data viz ramp" subtitle="Six hues at one lightness and one chroma — order-independent, safe to shuffle" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-canvas); color:var(--text-primary);
         -webkit-font-smoothing:antialiased; padding:20px 24px; }
  .lbl { font-family:var(--font-mono); font-size:10px; letter-spacing:var(--tracking-micro);
         text-transform:uppercase; color:var(--text-tertiary); }
  .row { display:flex; gap:var(--space-3); align-items:flex-start; }
</style>
</head>
<body>
<div class="row" style="align-items:flex-end;gap:var(--space-2)">
    <div style="flex:1;display:flex;flex-direction:column;gap:6px">
      <div style="height:64px;background:var(--viz-1);border-radius:var(--radius-xs) var(--radius-xs) 0 0"></div>
      <div class="lbl">viz-1</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px">
      <div style="height:88px;background:var(--viz-2);border-radius:var(--radius-xs) var(--radius-xs) 0 0"></div>
      <div class="lbl">viz-2</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px">
      <div style="height:46px;background:var(--viz-3);border-radius:var(--radius-xs) var(--radius-xs) 0 0"></div>
      <div class="lbl">viz-3</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px">
      <div style="height:72px;background:var(--viz-4);border-radius:var(--radius-xs) var(--radius-xs) 0 0"></div>
      <div class="lbl">viz-4</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px">
      <div style="height:34px;background:var(--viz-5);border-radius:var(--radius-xs) var(--radius-xs) 0 0"></div>
      <div class="lbl">viz-5</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px">
      <div style="height:54px;background:var(--viz-6);border-radius:var(--radius-xs) var(--radius-xs) 0 0"></div>
      <div class="lbl">viz-6</div>
    </div>
  </div>
</body>
</html>
