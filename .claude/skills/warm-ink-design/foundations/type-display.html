<!-- @dsCard group="Type" viewport="700x180" name="Display scale" subtitle="Instrument Sans, tracking tightens as size grows (-0.022em at display)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-canvas); color:var(--text-primary);
         -webkit-font-smoothing:antialiased; padding:20px 24px; }
  .lbl { font-family:var(--font-mono); font-size:10px; letter-spacing:var(--tracking-micro);
         text-transform:uppercase; color:var(--text-tertiary); }
  .row { display:flex; gap:var(--space-3); align-items:flex-start; }
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:baseline;gap:16px">
      <span class="lbl" style="width:56px">48px</span>
      <span style="font-size:var(--text-5xl);line-height:var(--lh-5xl);letter-spacing:var(--tracking-display);font-weight:var(--weight-medium)">Agent operations</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:16px">
      <span class="lbl" style="width:56px">38px</span>
      <span style="font-size:var(--text-4xl);line-height:var(--lh-4xl);letter-spacing:var(--tracking-display);font-weight:var(--weight-medium)">Agent operations</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:16px">
      <span class="lbl" style="width:56px">30px</span>
      <span style="font-size:var(--text-3xl);line-height:var(--lh-3xl);letter-spacing:var(--tracking-display);font-weight:var(--weight-medium)">Agent operations</span>
    </div>
    <div style="display:flex;align-items:baseline;gap:16px">
      <span class="lbl" style="width:56px">24px</span>
      <span style="font-size:var(--text-2xl);line-height:var(--lh-2xl);letter-spacing:var(--tracking-display);font-weight:var(--weight-medium)">Agent operations</span>
    </div>
  </div>
</body>
</html>
