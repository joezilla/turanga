<!-- @dsCard group="Spacing" viewport="700x140" name="Space scale" subtitle="4px grid with 2px and 6px half-steps for control interiors" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-canvas); color:var(--text-primary);
         -webkit-font-smoothing:antialiased; padding:20px 24px; }
  .lbl { font-family:var(--font-mono); font-size:10px; letter-spacing:var(--tracking-micro);
         text-transform:uppercase; color:var(--text-tertiary); }
  .row { display:flex; gap:var(--space-3); align-items:flex-start; }
</style>
</head>
<body>
<div class="row" style="align-items:flex-end">
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <div style="width:var(--space-0-5);height:var(--space-0-5);background:var(--ink-800);border-radius:1px"></div>
      <div class="lbl">0.5</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <div style="width:var(--space-1);height:var(--space-1);background:var(--ink-800);border-radius:1px"></div>
      <div class="lbl">1</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <div style="width:var(--space-1-5);height:var(--space-1-5);background:var(--ink-800);border-radius:1px"></div>
      <div class="lbl">1.5</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <div style="width:var(--space-2);height:var(--space-2);background:var(--ink-800);border-radius:1px"></div>
      <div class="lbl">2</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <div style="width:var(--space-3);height:var(--space-3);background:var(--ink-800);border-radius:1px"></div>
      <div class="lbl">3</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <div style="width:var(--space-4);height:var(--space-4);background:var(--ink-800);border-radius:1px"></div>
      <div class="lbl">4</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <div style="width:var(--space-6);height:var(--space-6);background:var(--ink-800);border-radius:1px"></div>
      <div class="lbl">6</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <div style="width:var(--space-8);height:var(--space-8);background:var(--ink-800);border-radius:1px"></div>
      <div class="lbl">8</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <div style="width:var(--space-12);height:var(--space-12);background:var(--ink-800);border-radius:1px"></div>
      <div class="lbl">12</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <div style="width:var(--space-16);height:var(--space-16);background:var(--ink-800);border-radius:1px"></div>
      <div class="lbl">16</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <div style="width:var(--space-24);height:var(--space-24);background:var(--ink-800);border-radius:1px"></div>
      <div class="lbl">24</div>
    </div>
  </div>
</body>
</html>
