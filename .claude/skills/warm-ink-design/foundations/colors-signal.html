<!-- @dsCard group="Colors" viewport="700x140" name="Signal (brand accent)" subtitle="One cold teal against warm ink — the only hue that means “the system is working”" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); background:var(--bg-canvas); color:var(--text-primary);
         -webkit-font-smoothing:antialiased; padding:20px 24px; }
  .lbl { font-family:var(--font-mono); font-size:10px; letter-spacing:var(--tracking-micro);
         text-transform:uppercase; color:var(--text-tertiary); }
  .row { display:flex; gap:var(--space-3); align-items:flex-start; }
</style>
</head>
<body>
<div class="row">
    <div style="display:flex;flex-direction:column;gap:6px;flex:1">
      <div style="height:52px;background:var(--signal-100);border:1px solid var(--border-hairline);border-radius:var(--radius-sm)"></div>
      <div class="lbl">signal-100</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1">
      <div style="height:52px;background:var(--signal-200);border:1px solid var(--border-hairline);border-radius:var(--radius-sm)"></div>
      <div class="lbl">signal-200</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1">
      <div style="height:52px;background:var(--signal-300);border:1px solid var(--border-hairline);border-radius:var(--radius-sm)"></div>
      <div class="lbl">signal-300</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1">
      <div style="height:52px;background:var(--signal-400);border:1px solid var(--border-hairline);border-radius:var(--radius-sm)"></div>
      <div class="lbl">signal-400</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1">
      <div style="height:52px;background:var(--signal-500);border:1px solid var(--border-hairline);border-radius:var(--radius-sm)"></div>
      <div class="lbl">signal-500</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1">
      <div style="height:52px;background:var(--signal-600);border:1px solid var(--border-hairline);border-radius:var(--radius-sm)"></div>
      <div class="lbl">signal-600</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;flex:1">
      <div style="height:52px;background:var(--signal-700);border:1px solid var(--border-hairline);border-radius:var(--radius-sm)"></div>
      <div class="lbl">signal-700</div>
    </div>
  </div>
</body>
</html>
