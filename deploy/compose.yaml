# turanga — LONG-LIVED services only (AD-4).
#
# Per-run agent sandboxes are intentionally NOT declared here. They are created
# dynamically by the run-orchestrator via the Docker API with `--runtime=runsc`
# (gVisor) and `--network=none`, and reaped on completion (AD-1, AD-4, Epic 4).
name: turanga

services:
  postgres:
    image: pgvector/pgvector:pg17 # PG 17 + the `vector` extension (Epic 8 memory store); drop-in for postgres:17
    environment:
      POSTGRES_USER: turanga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turanga}
      POSTGRES_DB: turanga
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turanga -d turanga"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates a separate `control` database for control-api (AD-7) on first init.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:8
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Model gateway sidecar (AD-2/AD-6). Pinned immutable tag — never :latest.
  litellm:
    image: litellm/litellm-database:v1.94.1
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://turanga:${POSTGRES_PASSWORD:-turanga}@postgres:5432/turanga
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-turanga-dev}
      STORE_MODEL_IN_DB: "True"
      # Encrypts stored provider keys. Set once and NEVER rotate (old creds become undecryptable).
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-turanga-salt-dev}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 10s
      timeout: 5s
      retries: 20

  control-api:
    build:
      context: ..
      dockerfile: apps/control-api/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      PORT: "8080"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgresql://turanga:${POSTGRES_PASSWORD:-turanga}@postgres:5432/control
      # No baked-in default password — set these in deploy/.env (see .env.example).
      # If unset, control-api boots without seeding a user (and logs why).
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      # Set COOKIE_SECURE=true when serving over HTTPS (prod). Off for local http.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-turanga-dev}
      # Encrypts data-connection OAuth tokens at rest. Set once; changing it strands stored tokens.
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY:-dev-token-enc-key-change-me}
      # Google OAuth (Gmail data connection). Empty = "not configured" in the UI. See README.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:8080/oauth/google/callback}
      # Run-orchestrator (Epic 4). dev-insecure on macOS (no gVisor); refused in production.
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-dev-insecure}
      GUARD_ADMIN_URL: http://egress-guard:8081
      GUARD_ADMIN_TOKEN: ${GUARD_ADMIN_TOKEN:-dev-guard-admin}
      # Authenticates the Guard→orchestrator cost/kill callback (Story 4.5, E4-AD-10).
      GUARD_CALLBACK_TOKEN: ${GUARD_CALLBACK_TOKEN:-dev-guard-callback}
      AGENT_HARNESS_IMAGE: ${AGENT_HARNESS_IMAGE:-turanga/agent-harness:dev}
      # The named volume the guard's per-run sockets live on (docker-compose prefixes with the project
      # name). Tracks COMPOSE_PROJECT_NAME so an isolated test stack (turanga-e2e) mounts ITS own
      # guard volume, not the dev stack's. Defaults to the dev project when the env var is unset.
      GUARD_SANDBOX_VOLUME: ${COMPOSE_PROJECT_NAME:-turanga}_guard-run
    ports:
      - "8080:8080"
    volumes:
      # The orchestrator spawns per-run sandboxes via the Docker API. The socket is mounted ONLY
      # here (control plane), NEVER into a sandbox (E4-AD-4).
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20

  egress-guard:
    build:
      context: ..
      dockerfile: apps/egress-guard/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      PORT: "8081"
      GUARD_SOCKET_DIR: /run/guard
      GUARD_ADMIN_TOKEN: ${GUARD_ADMIN_TOKEN:-dev-guard-admin}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-turanga-dev}
      # The Guard→orchestrator cost/kill callback (Story 4.5, E4-AD-10).
      CONTROL_API_URL: http://control-api:8080
      GUARD_CALLBACK_TOKEN: ${GUARD_CALLBACK_TOKEN:-dev-guard-callback}
      # Optional Filter Hook demo (Story 4.6, FR-10) — unset ⇒ the default no-op (no inspector ships).
      GUARD_FILTER_SENTINEL: ${GUARD_FILTER_SENTINEL:-}
    volumes:
      # Shared with each sandbox (bound to /guard there): the per-run UDS lives here (E4-AD-1).
      - guard-run:/run/guard
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # A stub MCP server so "Add a tool" has a real remote MCP endpoint to verify against in dev + e2e
  # (Story 6.2). control-api reaches it in-network at http://mcp-stub:9000/mcp — that's the URL you
  # enter in the Tools UI. Holds no secrets; not part of the trust boundary.
  mcp-stub:
    build:
      context: ..
      dockerfile: apps/mcp-stub/Dockerfile
    environment:
      PORT: "9000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20

  # Build-only: produces the turanga/agent-harness:dev image the orchestrator runs per-run.
  # It is NOT a long-lived service (AD-4) — `no-op` keeps it from staying up. Build with
  # `docker compose build agent-harness-image` (or `--build` brings it along).
  agent-harness-image:
    build:
      context: ..
      dockerfile: apps/agent-harness/Dockerfile
    image: turanga/agent-harness:dev
    entrypoint: ["true"]
    restart: "no"
    profiles: ["build"]

volumes:
  pgdata:
  guard-run:
